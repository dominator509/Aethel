[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
pqcrypto-traits = "0.3.5"
bulletproofs = "5.0.0"
rand = "0.8.5"
curve25519-dalek = "4.1.3"
merlin = "3.0.0"
rand_core = "0.6.4"
sha2 = "0.11.0"
pqcrypto-mldsa = { version = "0.1.2", features = ["serialization"] }
pqcrypto-mlkem = { version = "0.1.1", features = ["serialization"] }

serde = { version = "1.0", features = ["derive"] }
