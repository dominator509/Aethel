[package]
name = "core_node"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
consensus = { version = "0.1.0", path = "../consensus" }
crypto = { version = "0.1.0", path = "../crypto" }
network = { version = "0.1.0", path = "../network" }
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
storage = { version = "0.1.0", path = "../storage" }
tokio = { version = "1.32.0", features = ["full"] }

[dev-dependencies]
quinn = "0.11"
rcgen = "0.13"
rustls = "0.23"
tempfile = "3.27.0"
